name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, a refresh: the same commit rebuilt on a freshly pulled base image,
  # with the runtime stage's `apt-get upgrade` run anew, then published as
  # `:main` for freddy's next deploy to pull. Without it the image only changes
  # when the code does, and a quiet month would leave production a month behind
  # on Node and Debian fixes. Monday 07:23 UTC is
  # clear of the 03:30 backup and freddy's 10:23 host update.
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      refresh:
        description: Rebuild main on fresh base images and publish it, as the weekly schedule does
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    # Tests run on the pull request, and the weekly refresh re-runs all of
    # them. A merge to main only builds, scans and publishes: re-running the
    # whole suite on every merge doubled the bill (1,549 of 2,669 CI minutes
    # in September), on GitHub Free's 2,000 private-repo minutes a month.
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run test:unit

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    # Tests run on the pull request, and the weekly refresh re-runs all of
    # them. A merge to main only builds, scans and publishes: re-running the
    # whole suite on every merge doubled the bill (1,549 of 2,669 CI minutes
    # in September), on GitHub Free's 2,000 private-repo minutes a month.
    if: github.event_name != 'push'
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: lifeos_test
          POSTGRES_USER: lifeos_app
          POSTGRES_PASSWORD: testpassword
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lifeos_app -d lifeos_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://lifeos_app:testpassword@localhost:5432/lifeos_test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Integration tests run against real tables, so the schema has to exist.
      - run: node scripts/migrate.mjs
      - run: npm run test:integration

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    # Tests run on the pull request, and the weekly refresh re-runs all of
    # them. A merge to main only builds, scans and publishes: re-running the
    # whole suite on every merge doubled the bill (1,549 of 2,669 CI minutes
    # in September), on GitHub Free's 2,000 private-repo minutes a month.
    if: github.event_name != 'push'
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: lifeos_e2e
          POSTGRES_USER: lifeos_app
          POSTGRES_PASSWORD: testpassword
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lifeos_app -d lifeos_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # The suite drives real sign-in, so it needs a real database. The
      # database-unreachable behaviour is covered by the first-run job.
      DATABASE_URL: postgresql://lifeos_app:testpassword@localhost:5432/lifeos_e2e
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  first-run:
    name: First-run bootstrap
    runs-on: ubuntu-latest
    # Tests run on the pull request, and the weekly refresh re-runs all of
    # them. A merge to main only builds, scans and publishes: re-running the
    # whole suite on every merge doubled the bill (1,549 of 2,669 CI minutes
    # in September), on GitHub Free's 2,000 private-repo minutes a month.
    if: github.event_name != 'push'
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: lifeos_firstrun
          POSTGRES_USER: lifeos_app
          POSTGRES_PASSWORD: testpassword
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lifeos_app -d lifeos_firstrun"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://lifeos_app:testpassword@localhost:5432/lifeos_firstrun
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Exercises the bundled server, not the source modules. A real bootstrap
      # failure once passed the whole integration suite because the tests
      # import src/ while production runs build/.
      - run: ./scripts/verify-first-run.sh

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Tests run on the pull request, and the weekly refresh re-runs all of
    # them. A merge to main only builds, scans and publishes: re-running the
    # whole suite on every merge doubled the bill (1,549 of 2,669 CI minutes
    # in September), on GitHub Free's 2,000 private-repo minutes a month.
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # This app stores medical and financial records; a high advisory
      # fails the build rather than filing a note for later.
      - run: npm audit --audit-level=high

  image:
    name: Build image
    runs-on: ubuntu-latest
    needs: [check, integration, e2e, first-run, audit]
    # On a push to main those jobs are skipped on purpose, and a job whose
    # needs were skipped is skipped too unless its condition says otherwise.
    # This runs when every need passed or was skipped, never after a failure
    # or a cancellation.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    permissions:
      contents: read
      packages: write
    env:
      # A refresh publishes under a tag of its own and never moves the commit's
      # SHA tag, so `:<sha>` always names the image that commit first shipped
      # as, and a bad refresh can be rolled back to it.
      REFRESH: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh) }}
      PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # The Raspberry Pi test target is arm64 and the Linode is amd64, so the
      # image has to carry both. QEMU makes the arm64 leg slower; building on
      # the server instead is not an option, because a 1 GB Nanode cannot run
      # `npm ci` and a Vite build without swapping itself to death.
      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      # Build on every trigger so a pull request proves the image still
      # builds; publish only from a push to main.
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          # Always resolve the base images afresh, and always rebuild the runtime
          # stage without its cached layers, so its `apt-get upgrade` runs today
          # rather than whenever the base image last changed.
          #
          # This used to be on a refresh only. On 2026-10-04 Debian shipped a
          # fix for a HIGH libpcre2 CVE, the scan below flagged it as fixed, and
          # every normal build reused a cached upgrade layer from before the fix.
          # The scan failed, the image was never published, and main stopped
          # deploying until a refresh was run by hand. Rebuilding just this
          # stage measured 163s against 350s for a normal cached build (the
          # deps and build stages keep their cache), so it costs little.
          pull: true
          no-cache-filters: runtime
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.REFRESH == 'true' && format('refresh-{0}', github.run_id) || github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Recorded for the run's summary. Deploys pull by tag, which is why a
      # refresh never reuses one.
      - name: Record digest
        if: steps.build.outputs.digest != ''
        run: echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Scan image
        if: env.PUBLISH == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.REFRESH == 'true' && format('refresh-{0}', github.run_id) || github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
