# LifeOS reverse proxy.
#
# Binds 8080 on loopback only; Tailscale Serve terminates TLS in front of it.
# There is no public listener and no Funnel — see OPS-006.

upstream lifeos_app {
    server app:3000;
    keepalive 16;
}

# Tailscale Serve is the only thing that reaches this, and it sets
# X-Forwarded-* itself. Trust it explicitly rather than trusting any client.
set_real_ip_from 127.0.0.1;
set_real_ip_from 100.64.0.0/10;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
    listen 8080;
    server_name _;

    # Uploads: images from the Notion import and future attachments.
    client_max_body_size 64m;
    client_body_timeout 120s;

    # The app is private and served over Tailscale; nothing here should be
    # framed, sniffed, or indexed.
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "DENY"               always;
    add_header Referrer-Policy           "same-origin"        always;
    add_header X-Robots-Tag              "noindex, nofollow"  always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Immutable build assets carry a content hash in the filename.
    location /_app/immutable/ {
        proxy_pass http://lifeos_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Liveness is unauthenticated and polled; keep it out of the access log.
    location = /api/health/live {
        access_log off;
        proxy_pass http://lifeos_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://lifeos_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection        "";

        # Streamed responses must not be buffered into a single write.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
